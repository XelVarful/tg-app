<!doctype html>
<html lang="ru">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"><meta name="theme-color" content="#0c0c0e"><meta name="color-scheme" content="dark"><title>Band · IELTS</title><link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js" defer></script><script src="app.js" defer></script></head>
<body>
<div class="app">
<header><a class="brand" href="./">band<span>.</span></a><span class="header-label">IELTS PLANNER</span></header>
<main>
<div class="page-heading"><h1 id="page-title">Задачи</h1><button id="today-button" class="quiet-button">Сегодня</button></div>
<section id="tasks-view">
<div class="date-row"><button class="icon-button" data-day="-1" aria-label="Предыдущий день" data-icon="left"></button><button id="open-calendar" class="date-title"></button><button class="icon-button" data-day="1" aria-label="Следующий день" data-icon="right"></button></div>
<div id="week" class="week"></div>
</section>
<section id="calendar-view" hidden><div class="month-row"><h2 id="month-label"></h2><div><button class="icon-button" data-month="-1" aria-label="Предыдущий месяц" data-icon="left"></button><button class="icon-button" data-month="1" aria-label="Следующий месяц" data-icon="right"></button></div></div><div id="calendar" class="calendar"></div><p class="calendar-caption">Число под датой — выполненные задачи</p><div class="activity-line"><span id="activity-date"></span><strong id="activity-count"></strong></div></section>
<section id="task-area"><div id="section-filters" class="section-filters" aria-label="Секция IELTS"></div><div class="list-heading"><h2 id="list-title">План на день</h2><span id="day-count"></span></div><div class="progress-track"><div id="day-progress"></div></div><div id="task-list"></div></section>
<section id="progress-view" hidden><p class="view-description">Твоя подготовка в цифрах</p><div class="stats"><div><strong id="total-done">0</strong><span>Выполнено</span></div><div><strong id="active-days">0</strong><span>Дней занятий</span></div><div><strong id="streak">0</strong><span>Дней подряд</span></div></div><div class="list-heading"><h2>По секциям</h2><span>За всё время</span></div><div id="section-progress"></div><div class="activity-heading"><h2>Последние 7 дней</h2><span id="weekly-total"></span></div><div id="activity-chart" class="activity-chart"></div></section>
</main>
<div class="bottom-area"><button class="primary add-button" id="add-task"><span data-icon="plus"></span>Добавить задачу</button><nav aria-label="Навигация"><button data-page="tasks" class="active" aria-current="page"><span data-icon="tasks"></span>Задачи</button><button data-page="calendar"><span data-icon="calendar"></span>Календарь</button><button data-page="progress"><span data-icon="progress"></span>Прогресс</button></nav></div>
</div>
<dialog id="task-dialog" aria-labelledby="dialog-title"><form id="task-form"><div class="sheet-handle"></div><div class="modal-heading"><h2 id="dialog-title">Новая задача</h2><button type="button" class="icon-button" id="close-dialog" aria-label="Закрыть" data-icon="close" autofocus></button></div><label>Что нужно сделать?<input name="title" maxlength="180" required placeholder="Например, написать эссе" autocomplete="off"></label><div class="form-row"><label>Секция<select name="section"><option value="listening">Listening</option><option value="reading">Reading</option><option value="writing">Writing</option><option value="speaking">Speaking</option></select></label><label>Дата<input type="date" name="date" required></label></div><label>Заметка <span class="optional">необязательно</span><textarea name="note" maxlength="1000" placeholder="Тема или ссылка на материал" rows="2"></textarea></label><button class="primary" type="submit" id="save-task">Добавить</button><button type="button" id="delete-task" class="delete-button" hidden>Удалить задачу</button></form></dialog>
<div class="toast" id="toast" role="status"></div>
</body></html>
